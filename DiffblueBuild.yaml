meta:
  version: 1
  toolName: ant

cmd:
  windows:
    - ant
  linux:
    - ant
  macos:
    - ant

global:
  flags: ~
  timeout: PT10M
  plugins: ~

phase:

  info:
    goals:
      - name: ~
        goal: info
        flags: ~

  launcher: ~

  clean:
    goals:
      - name: ~
        goal: clean
        flags: ~

  build:
    goals:
      - name: ~
        goal: test-compile
        flags: ~

  test:
    timeout: PT60M
    goals:
      - name: ~
        goal: test
        flags:
          - ${DIFFBLUE_TEST_FILTER}
    filter:
      default:
        - -Dtest.name=**/Test*.java,**/*DiffblueTest.java
      neverDiffblue:
        - -Dtest.name=**/Test*.java
      onlyDiffblue:
        - -Dtest.name=**/*DiffblueTest.java
      named:
        - -Dtest.name=**/${DIFFBLUE_TEST_FILE}.java

  coverage:
    timeout: PT60M
    goals:
      - name: ~
        goal: coverage-report
        flags:
          - ${DIFFBLUE_TEST_FILTER}
    filter:
      default:
        - -Dtest.name=**/Test*.java,**/*DiffblueTest.java
      neverDiffblue:
        - -Dtest.name=**/Test*.java
      onlyDiffblue:
        - -Dtest.name=**/*DiffblueTest.java
      named:
        - -Dtest.name=**/${DIFFBLUE_TEST_FILE}.java

  refactor:
    goals: ~

  validate:
    goals:
      - name: ~
        goal: clean
        flags: ~

      - name: ~
        goal: test
        flags: ~
